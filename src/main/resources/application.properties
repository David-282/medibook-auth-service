#spring.config.import=optional:file:.env[.properties]

spring.application.name=medibook-auth-service

server.port=8081

jwt.secret=your-super-secret-key-at-least-32-characters-long
jwt.expiration=86400000

#JWT_SECRET=your-super-secret-key-at-least-32-characters-long
#JWT_EXPIRATION=86400000

spring.datasource.url=jdbc:postgresql://localhost:5432/medibook_auth
spring.datasource.username=postgres
spring.datasource.password=1234db


#DB_URL=jdbc:postgresql://localhost:5432/medibook_auth
#DB_USERNAME=postgres
#DB_PASSWORD=1234db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.kafka.bootstrap-servers=9092